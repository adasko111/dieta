# Konfiguracja używana wewnątrz kontenera (patrz Dockerfile).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Pliki w /assets/ mają hash w nazwie, więc mogą leżeć w cache dowolnie długo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html musi być świeży, inaczej po wdrożeniu przeglądarka
    # wciąż ładowałaby stare nazwy plików z /assets/.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Aplikacja jest jednostronicowa — każdą nieznaną ścieżkę oddajemy do index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Drobne utwardzenie: brak ramkowania i zgadywania typów.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
}
